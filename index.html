 navigator.geolocation.getCurrentPosition(g=>{const p=[g.coords.latitude,g.coords.longitude];st.og="gps";st.pt=[p[1],p[0]];if(ME)ME.remove();
  ME=L.layerGroup([L.circle(p,{radius:g.coords.accuracy,color:"#2f6fe4",weight:1,fillOpacity:.12}),L.circleMarker(p,{radius:8,color:"#fff",weight:3,fillColor:"#2f6fe4",fillOpacity:1}).bindTooltip("Estás aquí",{className:"tt",direction:"top"})]).addTo(M);
  if(!st.cur)M.setView(p,15);chrome();refresh();toast("Ubicación lista: tus rutas salen desde aquí")},
 e=>{toast(e.code===1?"Permiso de ubicación denegado. Actívalo en el navegador (candado de la barra de direcciones).":e.code===3?"La ubicación tardó demasiado. Intenta de nuevo.":"No se pudo obtener tu ubicación. Si abriste el archivo localmente, prueba tocando el mapa para fijar tu punto.",5000)},
 {enableHighAccuracy:true,timeout:12000,maximumAge:30000})}
$("#lc").onclick=locate;
const PN=L.layerGroup().addTo(M);
$("#og").onchange=e=>{st.og=e.target.value;PN.clearLayers();go("mapa");if(st.og==="gps")locate();else{st.pt=null;toast("Toca un punto del mapa para fijar tu salida",3500);refresh()}};
M.on("click",e=>{if(st.og==="pin"){st.pt=[e.latlng.lng,e.latlng.lat];PN.clearLayers();L.circleMarker(e.latlng,{radius:9,color:"#fff",weight:3,fillColor:"#e62a3a",fillOpacity:1}).bindTooltip("Salida",{className:"tt",direction:"top"}).addTo(PN);refresh()}});
$("#ps").onclick=e=>{e.target.classList.toggle("on");e.target.classList.contains("on")?LP.addTo(M):M.removeLayer(LP)};
document.addEventListener("change",e=>{if(e.target.id==="lang"||e.target.id==="lang2")setLang(e.target.value)});
const LK=L.layerGroup([L.polyline(K.ida,{color:"#ff7a00",weight:9,opacity:.9}),L.polyline(K.vuelta,{color:"#8e2de2",weight:3.5}),

 L.circleMarker(K.ida.at(-1),{radius:7,color:"#fff",weight:3,fillColor:"#8e2de2",fillOpacity:1}).bindTooltip("Retorno: fin de Ida / inicio de Vuelta",{className:"tt",direction:"top"})]);

function setK(on){const b=$("#pk");b.classList.toggle("on",on);if(on){LK.addTo(M);lg.addTo(M);LK.eachLayer(l=>l.bringToBack&&l.bringToBack())}else{M.removeLayer(LK);lg.remove()}}
$("#pk").onclick=()=>setK(!$("#pk").classList.contains("on"));
/* ===== Usuarios, guías turísticos y reseñas ===== */

const GD=[
{id:"d1",n:"Mariana",a:"Ortega",demo:1,bio:"Historiadora barranquillera. Recorridos por el río y el Centro.",lg:["Español","Inglés"],rs:{ig:"mariana.guia",fb:"mariana.ortega",wa:"573001112233"},lu:["malecon","puerta","centro","pcc"],rt:[{n:"Atardecer en el Gran Malecón",h:"2 h",pr:"$60.000"},{n:"Centro histórico a pie",h:"3 h",pr:"$80.000"}],rv:[["Laura Mejía",5,"Explica muy bien y conoce todos los rincones."],["Daniel Pérez",5,"Recorrido ameno y súper amable."]]},
{id:"d2",n:"Andrés",a:"Villalba",demo:1,bio:"Guía bilingüe, especialista en gastronomía y playas del área metropolitana.",lg:["Español","Inglés","Francés"],rs:{ig:"andres.tours.baq",tt:"andrestoursbaq"},lu:["centro","prado","riomar","puerto"],rt:[{n:"Ruta gastronómica Riomar",h:"3 h",pr:"$120.000"},{n:"Puerto Colombia: muelle y playa",h:"5 h",pr:"$150.000"}],rv:[["Camila Torres",4,"Muy buena comida y buen ritmo. Recomendado."],["Mark Johnson",5,"Great English and local tips!"]]},
{id:"d3",n:"Sofía",a:"Cantillo",demo:1,bio:"Cultura, deporte y vida universitaria. Tours en grupo o privados.",lg:["Español","Portugués"],rs:{ig:"sofia.cultura.baq",fb:"sofia.cantillo"},lu:["pcc","uninorte","metro","metrocentro","boulevard"],rt:[{n:"Día de fútbol: Estadio Metropolitano",h:"4 h",pr:"$90.000"},{n:"Cultura y museos del Caribe",h:"3 h",pr:"$70.000"}],rv:[["Julián Ríos",5,"Excelente experiencia en el estadio."]]}];
const GL=()=>[...GD,...US.filter(u=>u.r==="guia"&&u.g).map(u=>({id:u.id,n:u.n,a:u.a,...u.g}))];
const grv=g=>[...(GR[g.id]||[]),...(g.rv||[]).map(r=>({u:r[0],s:r[1],t:r[2],demo:1}))];
const gst=g=>{const r=grv(g);return r.length?(r.reduce((a,x)=>a+x.s,0)/r.length).toFixed(1):null};
const rvh=x=>`<div class="pc rv"><div><b>${esc(x.u)}</b> · ${STARS(x.s)}${x.demo?" · <i class='ej'>ejemplo</i>":""}</div><small>${esc(x.t)}</small></div>`;
const nf=k=>`<div class="two"><input id="${k}n" placeholder="Nombre" maxlength="40" value="${esc(me()?me().n:"")}"><input id="${k}a" placeholder="Apellido" maxlength="40" value="${esc(me()?me().a:"")}"></div>`;
const getName=k=>{const n=$("#"+k+"n").value.trim(),a=$("#"+k+"a").value.trim();if(!n||!a){toast("Para reseñar escribe tu nombre y apellido",2800);return null}return n+" "+a};
const socs=g=>SOC.filter(s=>g.rs&&g.rs[s[0]]).map(s=>{const h=g.rs[s[0]],t=IC(s[1])+" "+(s[0]==="wa"?"+"+esc(h):"@"+esc(h));return g.demo?`<span class="ch">${t}</span>`:`<a class="ch" target="_blank" rel="noopener" href="${s[3](encodeURIComponent(h))}">${t}</a>`}).join("");
function guiTab(p){const gs=GL().filter(g=>(g.lu||[]).includes(p.id)),u=me();
 const h=`<h3 style="margin-top:4px">${IC("person-badge")} Guías en ${esc(p.n)}</h3>`+(gs.map(guideCard).join("")||"<p>Aún no hay guías para este lugar.</p>");
 return h+(u&&u.r==="guia"?`<button class="btn alt" data-a="gplace" data-v="${p.id}">${IC("geo-alt")} ${(u.g.lu||[]).includes(p.id)?"Quitar este lugar de mis tours":"Ofrecer mis tours aquí"}</button>`:u?"":`<button class="btn" data-a="auth" data-v="reg">${IC("person-badge")} Soy guía: crear mi perfil</button>`)}
function contactg(id){const g=GL().find(x=>x.id===id);if(!g)return;const phone=(g.rs||{}).wa,rs=socs(g);
 mc(`<h3 style="margin:0 0 6px">${IC("person-badge")} Contactar a ${esc(g.n+" "+g.a)}</h3><p>${esc(g.bio||"Sin biografía registrada.")}</p><div class="kp"><div><b>${IC("translate")}</b>${(g.lg||[]).map(esc).join(" · ")||"—"}</div><div><b>${IC("star-fill","stars")} ${gst(g)||"Nuevo"}</b>calificación</div><div><b>${IC("geo-alt")} ${(g.lu||[]).length}</b>lugares</div></div><h3>Redes sociales</h3><div class="row">${rs||"<span class=\"ch\">Sin redes registradas</span>"}</div><h3>Teléfono</h3>${phone?`<div class="setrow"><span>${IC("whatsapp")} +${esc(phone)}</span><a class="ch" target="_blank" rel="noopener" href="https://wa.me/${encodeURIComponent(phone)}">${IC("box-arrow-up-right")} Abrir</a></div><button class="btn alt" data-a="copyphone" data-v="${esc(phone)}">${IC("copy")} Copiar número</button>`:"<p>Este guía no ha registrado un número de contacto.</p>"}<button class="btn" data-a="mclose">Cerrar</button>`)}
function gmodal(id){const g=GL().find(x=>x.id===id);if(!g)return;GS=5;const R=grv(g),s=gst(g);
 mc(`<h3 style="margin:0 0 4px">${esc(g.n+" "+g.a)}</h3><p>${IC("star-fill","stars")} ${s||"Nuevo"} · ${R.length} reseñas · ${IC("translate")} ${(g.lg||[]).map(esc).join(", ")}</p><h3>Califica a este guía</h3><div class="row" id="gst" style="margin-bottom:8px">${[1,2,3,4,5].map(n=>`<button class="ch ${n<=GS?"on":""}" data-a="gstar" data-v="${n}">${n} ${IC("star-fill","stars")}</button>`).join("")}</div>${nf("g")}<textarea class="ta" id="gt" rows="3" maxlength="400" placeholder="Cuéntanos cómo fue tu recorrido…"></textarea><button class="btn" data-a="gsend" data-v="${esc(g.id)}">Publicar reseña</button><h3>Reseñas</h3>${R.map(rvh).join("")||"<p>Sé la primera persona en reseñar.</p>"}`)}
function authm(m){m=m||"login";mc(`<h3 style="margin:0 0 10px">${IC("person")} ${m==="reg"?"Crear cuenta":"Iniciar sesión"}</h3><div class="row" style="margin-bottom:10px"><button class="ch ${m==="login"?"on":""}" data-a="auth" data-v="login">Iniciar sesión</button><button class="ch ${m==="reg"?"on":""}" data-a="auth" data-v="reg">Crear cuenta</button></div>`+(m==="reg"?`<div class="two"><input id="un" placeholder="Nombre" maxlength="40"><input id="ua" placeholder="Apellido" maxlength="40"></div>`:"")+`<input class="fi" id="ue" type="email" placeholder="Correo"><input class="fi" id="up" type="password" placeholder="Contraseña (mín. 4)">`+(m==="reg"?`<select class="fi" id="ur"><option value="turista">Soy turista</option><option value="guia">Soy guía turístico</option></select>`:"")+`<button class="btn" data-a="${m==="reg"?"reggo":"logingo"}">${m==="reg"?"Crear cuenta":"Entrar"}</button><p style="font-size:12px;margin-top:8px">Prototipo de prueba: los datos se guardan solo en este navegador.</p>`)}
function profm(){const u=me(),g=u.g||{};mc(`<h3 style="margin:0 0 8px">${IC("person-badge")} Mi perfil de guía</h3><textarea class="ta" id="fb" rows="3" maxlength="300" placeholder="Cuéntanos sobre ti">${esc(g.bio||"")}</textarea><input class="fi" id="fl" placeholder="Idiomas (separados por coma)" value="${esc((g.lg||[]).join(", "))}">${SOC.map(s=>`<input class="fi" id="f_${s[0]}" placeholder="${s[2]}${s[0]==="wa"?" (solo números, con indicativo)":" (usuario)"}" value="${esc((g.rs||{})[s[0]]||"")}">`).join("")}<h3>Lugares donde ofreces tours</h3><div class="pills" id="fu">${P.map(x=>`<label class="ch"><input type="checkbox" value="${x.id}" ${(g.lu||[]).includes(x.id)?"checked":""}> ${IC(x.e)} ${esc(x.n)}</label>`).join("")}</div><h3>Rutas (una por línea)</h3><textarea class="ta" id="fr" rows="4" placeholder="Nombre | Duración | Precio">${esc((g.rt||[]).map(r=>[r.n,r.h||"",r.pr||""].join(" | ")).join("\n"))}</textarea><button class="btn" data-a="gsave">Guardar perfil</button>`)}

uMenu();

chrome();renderSearch();renderBenefits();if(st.og==="gps")locate();
